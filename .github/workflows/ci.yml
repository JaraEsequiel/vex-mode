name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: |
          python3 -m unittest discover -s checks/tests -v
          python3 -m unittest discover -s scripts/tests -v
          python3 -m unittest discover -s hooks/tests -v
          python3 -m unittest discover -s evals/tests -v
      - name: Structural checks
        run: python3 checks/run.py
      - name: Install agy
        uses: jdx/mise-action@v2
        with:
          install_args: antigravity-cli
          mise_toml: |
            [tools]
            antigravity-cli = "latest"
      - name: Claude Code tree is up to date
        run: python3 scripts/build_plugin.py --harness claude-code --check
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Plugin validation
        run: python3 scripts/validate_plugin.py
